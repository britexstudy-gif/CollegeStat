name: Bug (tooling or scripts)
description: A script or check does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Include the command you ran" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: input
    id: env
    attributes: { label: Node version and OS }
