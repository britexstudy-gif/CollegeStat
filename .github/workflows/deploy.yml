name: Deploy CollegeStat
on:
  # Deploy main only after its checks pass, or on demand.
  workflow_run:
    workflows: [Check CollegeStat]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    # Activating deploys is an explicit step: set the repository variable DEPLOY_ENABLED=true.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Public values are compiled into the bundle; they are not secrets.
      - run: npm run build
        env:
          NEXT_PUBLIC_CATALOGUE_SOURCE: supabase
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_AUTH_EMAIL_ENABLED: ${{ vars.NEXT_PUBLIC_AUTH_EMAIL_ENABLED || 'true' }}
          NEXT_PUBLIC_AUTH_GOOGLE_ENABLED: ${{ vars.NEXT_PUBLIC_AUTH_GOOGLE_ENABLED }}
          NEXT_PUBLIC_AUTH_APPLE_ENABLED: ${{ vars.NEXT_PUBLIC_AUTH_APPLE_ENABLED }}
          NEXT_PUBLIC_MAP_STYLE_URL: ${{ vars.NEXT_PUBLIC_MAP_STYLE_URL }}
          NEXT_PUBLIC_SUPPORT_URL: ${{ vars.NEXT_PUBLIC_SUPPORT_URL }}
      # Server secrets (SUPABASE_URL, SUPABASE_SECRET_KEY, OPENAI_*) live on the
      # Worker itself via `wrangler secret put`; deploys keep them unchanged.
      - run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
